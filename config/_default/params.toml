# -- Theme Options --
colorScheme = "noir"
# autumn
# avocado
# bloody
# blowfish
# congo
# fire
# forest
# github
# marvel
# neon
# noir
# one-light
# princess
# slate
# terminal
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
keywords = ["博客", "技术", "AI", "NAS", "开发者", "个人成长", "blog", "developer", "AI", "NAS"]
robots = "index, follow, max-image-preview:large, max-snippet:-1"
enableStructuredBreadcrumbs = true
defaultSocialImage = "img/social-card.png"

[header]
  layout = "fixed"
  # basic、fixed、fixed-fill、and fixed-fill-blur

[homepage]
  layout = "profile"
  # profile
  # page
  # hero
  # background
  # card

  showRecent = true
  showRecentItems = 9
  cardView = true
  showMoreLink = true

[article]
  showDate = true
  showAuthor = true
  showReadingTime = true
  showWordCount = true
  showHeadingAnchors = true
  showTaxonomies = true
  showTableOfContents = true
  showBreadcrumbs = true
  showComments = true
  showViews = true
  showLikes = true
  showPagination = false
  showZenMode = true
  # seriesOpened = false
  showHero = true
  heroStyle = "big"
  # basic、big、background、thumbAndBackground
  # showEdit = true
[list]
  groupByYear = false
  cardView = true
  showSummary = true
  showViews = true
  showLikes = true

# Firebase configuration for views and likes
# Get your config from: https://console.firebase.google.com/
# Project settings → General → Your apps → Web app
[firebase]
  apiKey = "YOUR_API_KEY"
  authDomain = "YOUR_PROJECT_ID.firebaseapp.com"
  projectId = "YOUR_PROJECT_ID"
  storageBucket = "YOUR_PROJECT_ID.appspot.com"
  messagingSenderId = "YOUR_SENDER_ID"
  appId = "YOUR_APP_ID"
  # measurementId = "YOUR_MEASUREMENT_ID"  # Optional

[umamiAnalytics]
  websiteid = "YOUR_websiteid"
  domain = "YOUR_domain"
  enableTrackEvent = true

# Site verification (Search Console)
# 注册后填入 token：https://search.google.com/search-console
[verification]
  google = ""
  bing = ""
