# -- Theme Options --
colorScheme = "zhenda-cyan"
# zhenda-cyan (青色中性: 冷灰底 + 青色主色, 阅读导向)
# zhenda-premium (墨金: 暖灰底 + 琥珀金主色)
# noir / blowfish / slate / forest / ocean / etc.
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
keywords = ["博客", "技术", "AI", "NAS", "开发者", "个人成长", "blog", "developer", "AI", "NAS"]
robots = "index, follow, max-image-preview:large, max-snippet:-1"
enableStructuredBreadcrumbs = true
defaultSocialImage = "img/social-card.png"
defaultFeaturedImage = "img/default-cover.svg"
mainSections = ["posts"]

[header]
  layout = "fixed-fill-blur"
  # basic / fixed / fixed-fill / fixed-fill-blur (毛玻璃效果最精致)

[homepage]
  layout = "hero"
  # hero (自定义渐变 Hero) / profile / page / background / card

  showRecent = true
  showRecentItems = 9
  cardView = true
  showMoreLink = true

[article]
  showDate = true
  showAuthor = true
  showReadingTime = true
  showWordCount = true
  showHeadingAnchors = true
  showTaxonomies = true
  showTableOfContents = true
  showBreadcrumbs = true
  showComments = true
  showViews = false
  showLikes = false
  showPagination = false
  showZenMode = true
  showReadingProgress = true
  showHero = false
  # 无 hero: 纯阅读排版 (阅读导向)
  heroStyle = "basic"
[list]
  groupByYear = false
  cardView = true
  showSummary = true
  showViews = false
  showLikes = false

[taxonomy]
  showTermCount = true
  cardView = false

[term]
  showHero = true
  heroStyle = "basic"
  groupByYear = false
  cardView = true

# Firebase configuration for views and likes
# Get your config from: https://console.firebase.google.com/
# Project settings → General → Your apps → Web app
[firebase]
  apiKey = "YOUR_API_KEY"
  authDomain = "YOUR_PROJECT_ID.firebaseapp.com"
  projectId = "YOUR_PROJECT_ID"
  storageBucket = "YOUR_PROJECT_ID.appspot.com"
  messagingSenderId = "YOUR_SENDER_ID"
  appId = "YOUR_APP_ID"
  # measurementId = "YOUR_MEASUREMENT_ID"  # Optional

# [umamiAnalytics]
#   websiteid = "YOUR_websiteid"
#   domain = "YOUR_domain"
#   enableTrackEvent = true

# Site verification (Search Console)
# 注册后填入 token：https://search.google.com/search-console
[verification]
  google = ""
  bing = ""
